[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sft-tokenization"
version = "0.1.0"
description = "Generic prompt/completion tokenization and sequence packing utilities for supervised causal-LM training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "torch>=2.1",
]

[project.optional-dependencies]
hf = ["transformers>=4.45"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
